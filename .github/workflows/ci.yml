name: ci
on: [push, pull_request]

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pynacl
      - run: node tools/verify-test-vectors.mjs
      - run: bash tools/verify-vectors-openssl.sh
      - run: python3 tools/verify-vectors-pynacl.py

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Test packages in dependency order
        run: |
          for dir in \
            packages/identity \
            packages/signed-files \
            packages/local-store \
            packages/bt-catalog \
            adapters/settlement \
            adapters/human-task \
            apps/demo-indexer; do
            npm ci --prefix "$dir"
            npm test --prefix "$dir"
            npm run build --prefix "$dir"
          done

  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build station dependencies
        run: |
          for dir in packages/identity packages/signed-files packages/local-store; do
            npm ci --prefix "$dir"
            npm run build --prefix "$dir"
          done
          npm ci --ignore-scripts --prefix packages/bt-catalog
          npm run build --prefix packages/bt-catalog
          npm ci --prefix apps/demo-indexer
          npm run build --prefix apps/demo-indexer
      - run: npm ci --prefix apps/station
      - run: npm test --prefix apps/station
      - run: npm run test:typecheck --prefix apps/station
      - name: Three-role station demo
        run: bash apps/station/examples/station-demo.sh

  email:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.0
        ports: ['3025:3025', '3143:3143']
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
          GREENMAIL_USERS: "trader:secret@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --prefix adapters/email
      - run: npm run build --prefix adapters/email
      - name: unit tests
        run: npm test --prefix adapters/email
      - name: GreenMail integration tests
        run: GREENMAIL=1 npm test --prefix adapters/email

  dsh-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts --prefix integrations/deepseek-harness/plugin
      - run: npm test --prefix integrations/deepseek-harness/plugin
      - name: Pack installable bundle
        working-directory: packages/dsh-plugin
        run: |
          mkdir -p release
          npm pack --pack-destination release
          tar -tzf release/*.tgz | grep 'package/runtime/server.mjs'
