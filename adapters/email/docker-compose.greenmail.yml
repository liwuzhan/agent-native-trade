# GreenMail standalone mail server for the M5 email adapter integration tests.
#
#   docker compose -f docker-compose.greenmail.yml up -d
#   GREENMAIL=1 npx vitest run          # from adapters/email
#
# Ports (plaintext, per docs/module-cards/M5-email.md):
#   - SMTP 3025
#   - IMAP 3143
#
# Test account provisioned via GREENMAIL_USERS (format login:pwd@domain):
#   login `trader`, password `secret`, email `trader@example.com`.
# The image default already sets -Dgreenmail.auth.disabled, so the credentials
# are nominal; the provisioned user guarantees local delivery routing.
#
# Any recent tag works (2.0.1+); 2.1.0 is pinned here.
services:
  greenmail:
    image: greenmail/standalone:2.1.0
    container_name: agent-trade-greenmail
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
      GREENMAIL_USERS: "trader:secret@example.com"
